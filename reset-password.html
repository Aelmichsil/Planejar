<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planejar — Redefinir senha</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🗂️</div>
      <span class="logo-name">Planejar</span>
    </div>

    <h1 class="auth-title">Redefinir senha</h1>
    <p class="auth-subtitle">Escolha uma nova senha para sua conta.</p>

    <div id="reset-alert" class="alert alert-error"></div>

    <form id="reset-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="new-password">Nova senha</label>
        <input id="new-password" type="password" class="form-input" placeholder="Mínimo 6 caracteres" required>
      </div>
      <div class="form-group form-group-end">
        <label class="form-label" for="confirm-password">Confirmar nova senha</label>
        <input id="confirm-password" type="password" class="form-input" placeholder="Repita a nova senha" required>
      </div>
      <button id="reset-submit" type="submit" class="btn btn-primary">Salvar nova senha</button>
    </form>

    <div class="auth-footer-center">
      <a href="login.html" class="auth-link-btn reset-margin">Voltar para login</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
